name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check src tests streamlit_app

      - name: Validate Compose configuration
        run: docker compose config --quiet
