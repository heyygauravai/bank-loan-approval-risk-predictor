services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro

  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--browser.gatherUsageStats", "false"]
    environment:
      LOAN_API_URL: http://api:8000/predict
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
