[project]
name = "loan-approval-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurav Chaudhary", email = "heyygaurav07@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
loan-approval-prediction = "loan_approval_prediction:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
